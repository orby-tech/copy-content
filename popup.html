<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <style>
    :root {
      --color-success: rgba(22, 163, 74, 0.92);
      --color-error: rgba(220, 38, 38, 0.92);
      --color-highlight-border: #1a73e8;
      --color-highlight-fill: rgba(26, 115, 232, 0.08);
      --color-toast-text: #fff;
      --color-toast-shadow: rgba(0, 0, 0, 0.25);

      --font-xs: 11px;
      --font-sm: 12px;
      --font-md: 13px;

      --space-px: 1px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;

      --radius-sm: 4px;
      --radius-md: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      padding: var(--space-3);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: var(--font-md);
      color: #1a1a1a;
      background: #fff;
    }

    .page-title {
      font-weight: 600;
      font-size: var(--font-md);
      margin-bottom: var(--space-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #444;
    }

    .buttons {
      display: flex;
      gap: var(--space-1);
      margin-bottom: var(--space-3);
    }

    button {
      flex: 1;
      padding: var(--space-2) var(--space-3);
      border: 1px solid #d0d0d0;
      border-radius: var(--radius-md);
      background: #f5f5f5;
      cursor: pointer;
      font-size: var(--font-sm);
      font-weight: 500;
      transition: background 0.1s, border-color 0.1s;
    }

    button:hover {
      background: #e8e8e8;
      border-color: #aaa;
    }

    button.primary {
      background: var(--color-highlight-border);
      color: var(--color-toast-text);
      border-color: var(--color-highlight-border);
    }

    button.primary:hover {
      background: #1558c0;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

#preview {
      width: 100%;
      height: 260px;
      border: 1px solid #e0e0e0;
      border-radius: var(--radius-md);
      padding: var(--space-2);
      font-size: var(--font-xs);
      font-family: system-ui, -apple-system, sans-serif;
      color: #444;
      background: #fafafa;
      line-height: 1.5;
      overflow-y: auto;
      word-break: break-word;
    }

    #preview:empty::before {
      content: attr(data-placeholder);
      color: #bbb;
    }

    #preview > * { margin-bottom: var(--space-1); }
    #preview > *:last-child { margin-bottom: 0; }

    #preview h1, #preview h2, #preview h3,
    #preview h4, #preview h5, #preview h6 {
      font-size: var(--font-xs);
      font-weight: 700;
      color: #222;
    }

    #preview ul, #preview ol { padding-left: var(--space-3); }
    #preview li { margin: var(--space-px) 0; }

    #preview code {
      background: #e8e8e8;
      border-radius: var(--radius-sm);
      padding: var(--space-px) var(--space-1);
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: var(--font-xs);
    }

    #preview pre {
      background: #e8e8e8;
      border-radius: var(--radius-sm);
      padding: var(--space-1) var(--space-2);
      overflow-x: auto;
    }

    #preview pre code { background: none; padding: 0; }

    #preview blockquote {
      border-left: 3px solid #d0d0d0;
      padding: var(--space-px) var(--space-2);
      color: #777;
    }

    #preview hr {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: var(--space-1) 0;
    }

    #preview a { color: var(--color-highlight-border); text-decoration: none; }
    #preview img { max-width: 100%; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: var(--space-1);
      min-height: 18px;
    }

    .status {
      font-size: var(--font-sm);
      color: var(--color-highlight-border);
      font-weight: 500;
    }

    .char-count {
      font-size: var(--font-xs);
      color: #999;
    }

    .support-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      margin-top: var(--space-2);
      font-size: var(--font-xs);
      color: #888;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .support-link:hover {
      color: #555;
    }

    .support-link svg {
      flex-shrink: 0;
    }

    .settings {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      margin: var(--space-2) 0 var(--space-1);
      padding: var(--space-2) var(--space-3);
      border: 1px solid #ececec;
      border-radius: var(--radius-md);
      background: #fafafa;
    }

    .settings label {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      font-size: var(--font-sm);
      color: #444;
      cursor: pointer;
      user-select: none;
    }

    .settings input[type="checkbox"] {
      margin: 0;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="page-title" id="page-title" data-i18n="loading">Loading…</div>

  <div class="buttons">
    <button id="btn-text" data-i18n="btnCopyText">Copy Text</button>
    <button id="btn-md" class="primary" data-i18n="btnCopyMd">Copy Markdown</button>
  </div>

  <div class="buttons">
    <button id="btn-pick-text" data-i18n="btnPickText">Pick Text</button>
    <button id="btn-pick-md" class="primary" data-i18n="btnPickMd">Pick Markdown</button>
  </div>

  <div id="preview" data-i18n-placeholder="noContent" data-placeholder="No content"></div>

  <div class="settings">
    <label>
      <input type="checkbox" id="opt-include-title-url">
      <span data-i18n="optIncludeTitleUrl">Include page title and URL</span>
    </label>
  </div>

  <div class="footer">
    <span class="status" id="status"></span>
    <span class="char-count" id="char-count"></span>
  </div>

  <a id="support-link" class="support-link"
     href="https://chat.orby-tech.space/c/pk_800206192abce648310985613f25ae05"
     target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true">
      <path d="M2.5 2h11A1.5 1.5 0 0 1 15 3.5v7A1.5 1.5 0 0 1 13.5 12H6.7l-3 2.7A.5.5 0 0 1 3 14.3V12h-.5A1.5 1.5 0 0 1 1 10.5v-7A1.5 1.5 0 0 1 2.5 2z"/>
    </svg>
    <span data-i18n="btnSupport">Support</span>
  </a>

  <script src="colors.js"></script>
  <script src="extractors.js"></script>
  <script src="popup.js"></script>
</body>

</html>
