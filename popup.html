<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      padding: 14px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #fff;
    }

    .page-title {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #444;
    }

    .buttons {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    button {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: background 0.1s, border-color 0.1s;
    }

    button:hover {
      background: #e8e8e8;
      border-color: #aaa;
    }

    button.primary {
      background: #1a73e8;
      color: #fff;
      border-color: #1a73e8;
    }

    button.primary:hover {
      background: #1558c0;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

#preview {
      width: 100%;
      height: 260px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      font-family: system-ui, -apple-system, sans-serif;
      color: #444;
      background: #fafafa;
      line-height: 1.5;
      overflow-y: auto;
      word-break: break-word;
    }

    #preview:empty::before {
      content: attr(data-placeholder);
      color: #bbb;
    }

    #preview > * { margin-bottom: 6px; }
    #preview > *:last-child { margin-bottom: 0; }

    #preview h1, #preview h2, #preview h3,
    #preview h4, #preview h5, #preview h6 {
      font-size: 11px;
      font-weight: 700;
      color: #222;
    }

    #preview ul, #preview ol { padding-left: 14px; }
    #preview li { margin: 1px 0; }

    #preview code {
      background: #e8e8e8;
      border-radius: 3px;
      padding: 1px 3px;
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: 10px;
    }

    #preview pre {
      background: #e8e8e8;
      border-radius: 4px;
      padding: 5px 7px;
      overflow-x: auto;
    }

    #preview pre code { background: none; padding: 0; }

    #preview blockquote {
      border-left: 3px solid #d0d0d0;
      padding: 1px 7px;
      color: #777;
    }

    #preview hr {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 5px 0;
    }

    #preview a { color: #1a73e8; text-decoration: none; }
    #preview img { max-width: 100%; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      min-height: 18px;
    }

    .status {
      font-size: 12px;
      color: #1a73e8;
      font-weight: 500;
    }

    .char-count {
      font-size: 11px;
      color: #999;
    }

    .support-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      font-size: 11px;
      color: #888;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .support-link:hover {
      color: #555;
    }

    .support-link svg {
      flex-shrink: 0;
    }
  </style>
</head>

<body>
  <div class="page-title" id="page-title" data-i18n="loading">Loading…</div>

  <div class="buttons">
    <button id="btn-text" data-i18n="btnCopyText">Copy Text</button>
    <button id="btn-md" class="primary" data-i18n="btnCopyMd">Copy Markdown</button>
  </div>

  <div class="buttons">
    <button id="btn-pick-text" data-i18n="btnPickText">Pick Text</button>
    <button id="btn-pick-md" class="primary" data-i18n="btnPickMd">Pick Markdown</button>
  </div>

  <div id="preview" data-i18n-placeholder="noContent" data-placeholder="No content"></div>

  <div class="footer">
    <span class="status" id="status"></span>
    <span class="char-count" id="char-count"></span>
  </div>

  <a id="support-link" class="support-link"
     href="https://chat.orby-tech.space/c/pk_800206192abce648310985613f25ae05"
     target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true">
      <path d="M2.5 2h11A1.5 1.5 0 0 1 15 3.5v7A1.5 1.5 0 0 1 13.5 12H6.7l-3 2.7A.5.5 0 0 1 3 14.3V12h-.5A1.5 1.5 0 0 1 1 10.5v-7A1.5 1.5 0 0 1 2.5 2z"/>
    </svg>
    <span data-i18n="btnSupport">Support</span>
  </a>

  <script src="extractors.js"></script>
  <script src="popup.js"></script>
</body>

</html>
